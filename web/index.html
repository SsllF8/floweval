<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowEval · 评测看板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 数据：单文件模式下由 CLI 内联，serve 模式下由 JS 拉取 data/latest.json -->
<script src="data/latest.json" type="application/json" id="floweval-data"></script>

<div class="layout">

  <!-- ------------------------------------------------ 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-7"/>
      </svg>
      <span>FlowEval</span>
    </div>
    <nav class="nav">
      <button class="nav-item is-active" data-section="overview">总览</button>
      <button class="nav-item" data-section="cases">用例明细</button>
      <button class="nav-item" data-section="nodes">节点分析</button>
      <button class="nav-item" data-section="regression">回归对比</button>
      <button class="nav-item" data-section="gate">上线判定</button>
    </nav>
    <div class="sidebar-foot">
      <div class="caption" id="side-run">—</div>
    </div>
  </aside>

  <!-- ------------------------------------------------ 主区 -->
  <main class="main">
    <div class="container">

      <header class="page-head">
        <div class="crumb">
          <span>评测</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          <span id="crumb-target">—</span>
        </div>
        <h1 id="page-title">评测总览</h1>
        <p class="sub" id="page-sub">加载中…</p>
      </header>

      <!-- ============================ 总览 -->
      <section class="section" id="sec-overview">

        <div class="card gate-card" id="gate-card">
          <div class="gate-head">
            <span class="gate-verdict" id="gate-verdict">—</span>
            <span class="gate-note" id="gate-note"></span>
          </div>
          <div class="rule-list" id="gate-rules"></div>
        </div>

        <div class="stat-grid">
          <div class="stat">
            <div class="stat-label">通过率</div>
            <div class="stat-value" id="s-pass-rate">—</div>
            <div class="stat-foot" id="s-pass-detail">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">平均分</div>
            <div class="stat-value" id="s-score">—</div>
            <div class="stat-foot" id="s-score-detail">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">P95 延迟</div>
            <div class="stat-value" id="s-latency">—</div>
            <div class="stat-foot" id="s-latency-detail">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">成本</div>
            <div class="stat-value" id="s-cost">—</div>
            <div class="stat-foot" id="s-cost-detail">—</div>
          </div>
        </div>

        <div class="two-col">
          <div class="card">
            <div class="card-head">
              <h2>失败归因</h2>
              <span class="caption">按节点聚合</span>
            </div>
            <div class="card-body" id="blame-chart"></div>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>分类表现</h2>
              <span class="caption">通过率 / 平均分</span>
            </div>
            <div class="card-body" id="category-table"></div>
          </div>
        </div>

        <div class="card" id="history-card" hidden>
          <div class="card-head">
            <h2>历史趋势</h2>
            <span class="caption">最近若干次运行</span>
          </div>
          <div class="card-body" id="history-chart"></div>
        </div>

      </section>

      <!-- ============================ 用例明细 -->
      <section class="section" id="sec-cases" hidden>
        <div class="toolbar">
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="case-search" type="text" placeholder="搜索用例内容…">
          </div>
          <div class="chips" id="case-filters"></div>
        </div>
        <div class="case-list" id="case-list"></div>
      </section>

      <!-- ============================ 节点分析 -->
      <section class="section" id="sec-nodes" hidden>
        <div class="card">
          <div class="card-head">
            <h2>节点耗时与失败率</h2>
            <span class="caption">跨全部用例聚合</span>
          </div>
          <div class="card-body" id="node-table"></div>
        </div>
      </section>

      <!-- ============================ 回归对比 -->
      <section class="section" id="sec-regression" hidden>
        <div class="card" id="regression-card">
          <div class="card-head">
            <h2>回归对比</h2>
            <span class="caption" id="regression-sub"></span>
          </div>
          <div class="card-body" id="regression-body"></div>
        </div>
      </section>

      <!-- ============================ 上线判定 -->
      <section class="section" id="sec-gate" hidden>
        <div class="card">
          <div class="card-head">
            <h2>上线判定规则</h2>
            <span class="caption">全部规则</span>
          </div>
          <div class="card-body" id="gate-detail"></div>
        </div>
      </section>

    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
